<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · IntentGuard</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0b0e14;
        --panel: #121722;
        --line: #252c3c;
        --fg: #e6ebf3;
        --muted: #a7b0c0;
        --accent: #2f6fed;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6fa;
          --panel: #ffffff;
          --line: #dce1ea;
          --fg: #0f172a;
          --muted: #465467;
          --accent: #1d5bd6;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 26rem;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 2.5rem 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" width="48" height="48" alt="" />
      <h1>Page not found</h1>
      <p>This address doesn't exist. IntentGuard is a single page; everything lives on the home page.</p>
      <a href="/">Go to IntentGuard</a>
    </main>
  </body>
</html>
