<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IntentGuard — Risk-Aware Autonomous Treasury</title>
    <meta
      name="description"
      content="IntentGuard: an AI treasury agent that turns goals into cross-chain intents, scores every route on cited evidence, and lets an on-chain policy vault enforce the user's mandate."
    />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IntentGuard" />
    <meta property="og:title" content="IntentGuard — Risk-Aware Autonomous Treasury" />
    <meta
      property="og:description"
      content="The AI decides. The chain enforces. Evidence-grounded risk scoring, adversarial review, fork simulation and an on-chain policy vault."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="IntentGuard — Risk-Aware Autonomous Treasury" />
    <meta
      name="twitter:description"
      content="The AI decides. The chain enforces. Evidence-grounded risk scoring, adversarial review, fork simulation and an on-chain policy vault."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("intentguard:theme");
        } catch (e) {}
        var dark = pref ? pref === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (!dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f6fa");
      })();
    </script>
  </head>
  <body>
    <noscript>IntentGuard needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
